backend:
  name: git-gateway
  branch: main
media_folder: "uploads"
public_folder: "/uploads"
collections:
  - name: "posts"
    label: "Home Posts"
    folder: "posts"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Media"
        name: "media"
        widget: "file"
      - label: "Caption"
        name: "caption"
        widget: "string"
        required: false
  - name: "luluplanet"
    label: "Luluplanet Posts"
    folder: "luluplanet-posts"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Media"
        name: "media"
        widget: "file"
      - label: "Caption"
        name: "caption"
        widget: "string"
        required: false
  - name: "random"
    label: "Random Posts"
    folder: "random-posts"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Media"
        name: "media"
        widget: "file"
      - label: "Caption"
        name: "caption"
        widget: "string"
        required: false
