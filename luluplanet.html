<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LuLu Planet — Thingvision</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="nav-bar">
    <button class="hamburger" id="menuBtn" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>
  </div>

  <div class="hero">
    <a href="index.html">
      <img src="main-image.png" alt="Thingvision logo" />
    </a>
  </div>

  <section class="gallery" id="gallery"></section>

  <div class="menu-overlay" id="menuOverlay">
    <div class="menu-panel">
      <button class="menu-close" id="menuClose">&#x2715;</button>
      <a class="menu-item" href="https://www.instagram.com/thingvision_/" target="_blank">Instagram</a>
      <a class="menu-item" href="https://www.tiktok.com/@thingvision_" target="_blank">TikTok</a>
      <a class="menu-item" href="random.html">Random</a>
      <a class="menu-item" href="luluplanet.html">LuLu Planet</a>
      <a class="menu-item" href="about.html">About</a>
    </div>
  </div>

  <script>
    const btn = document.getElementById('menuBtn');
    const overlay = document.getElementById('menuOverlay');
    const close = document.getElementById('menuClose');
    btn.addEventListener('click', () => overlay.classList.add('open'));
    close.addEventListener('click', () => overlay.classList.remove('open'));
    overlay.addEventListener('click', (e) => { if(e.target === overlay) overlay.classList.remove('open'); });

    async function loadPosts() {
      const gallery = document.getElementById("gallery");
      const res = await fetch(`https://api.github.com/repos/thingvision/home/contents/luluplanet-posts`);
      if (!res.ok) { gallery.innerHTML = "<p>API failed</p>"; return; }
      const files = await res.json();
      const postFiles = files.filter(f => f.name.endsWith(".md"));
      gallery.innerHTML = `<p>Found ${postFiles.length} md files</p>`;
      const posts = await Promise.all(postFiles.map(async f => {
        const r = await fetch(f.download_url);
        const text = await r.text();
        gallery.innerHTML += `<p>Raw text: ${text}</p>`;
        const parsed = parsePost(text);
        gallery.innerHTML += `<p>Parsed media: ${parsed.media}</p>`;
        return parsed;
      }));
    }

    function parsePost(text) {
      const data = {};
      text.split("\n").forEach(line => {
        line = line.replace(/^---/, "").trim();
        const colonIndex = line.indexOf(":");
        if (colonIndex === -1) return;
        const key = line.substring(0, colonIndex).trim();
        const value = line.substring(colonIndex + 1).trim().replace(/^["']|["']$/g, "");
        if (key) data[key] = value;
      });
      return data;
    }

    loadPosts();
  </script>

</body>
</html>
