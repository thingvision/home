<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>thingvision</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <a href="https://thingvision.net">
      <img src="main-image.png" alt="Main Image" class="main-image">
    </a>
  </header>

  <nav>
    <ul class="link-list">
      <li><a href="https://thingvision.net/luluplanet.html">lulu planet</a></li>
    </ul>
  </nav>

  <!-- Intro / logo section -->
  <section class="gallery">
    <div class="gallery-item">
      <img src="llplogo.png" alt="logo">
      <p style="text-align: center;">
        This is Lunlun's journey to find his home in a strange new world.
      </p>
    </div>
  </section>

  <!-- Dynamic posts -->
  <section class="gallery" id="gallery"></section>

  <script>
    const repoOwner = "thingvision";
    const repoName = "home";
    const postsFolder = "luluplanet-posts";

    async function loadPosts() {
      const gallery = document.getElementById("gallery");

      const res = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents/${postsFolder}`);
      const files = await res.json();

      const postFiles = files.filter(file => file.name.endsWith(".md"));

      const posts = await Promise.all(
        postFiles.map(async file => {
          const postRes = await fetch(file.download_url);
          const text = await postRes.text();
          return parsePost(text);
        })
      );

      posts.sort((a, b) => new Date(b.date) - new Date(a.date));

      gallery.innerHTML = posts.map(post => {
        const media = post.media || post.image;
        const isVideo = media && media.toLowerCase().endsWith(".mp4");

        return `
          <div class="gallery-item">
            ${
              isVideo
                ? `<video src="${media}" controls playsinline></video>`
                : `<img src="${media}" alt="Post media">`
            }
            <p class="timestamp">${post.date}</p>
            ${post.caption ? `<p class="caption">${post.caption}</p>` : ""}
          </div>
        `;
      }).join("");
    }

    function parsePost(text) {
      const frontmatter = text.split("---")[1];
      const data = {};

      frontmatter.split("\n").forEach(line => {
        const [key, ...valueParts] = line.split(":");
        if (!key || valueParts.length === 0) return;

        let value = valueParts.join(":").trim();
        value = value.replace(/^["']|["']$/g, "");

        data[key.trim()] = value;
      });

      return data;
    }

    loadPosts();
  </script>
</body>
</html>
